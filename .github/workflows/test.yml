name: Scientific checks
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python verify.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@98e3b21a1c45e26529208849ec20e5cfb7086040
        with:
          version: '24.10.4'
      - run: python -c "import numpy as np; np.save('smoke.npy', np.random.default_rng(7).poisson(2, (64, 20)).astype('float32'))"
      - run: nextflow run main.nf -profile local --smoke_counts smoke.npy
